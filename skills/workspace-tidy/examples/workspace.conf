# workspace-tidy config. Plain "key value" lines. Read with awk, never sourced.
worktrees  .worktrees
docs       docs

# Repos whose remote has no subgroup (gitlab.com/acme/thing.git) go here.
root-group legacy

# group <remote-group> <local-folder>; exact or prefix match on the remote group.
group  acme/platform      platform
group  acme/platform-v2   platform-v2
group  acme/clinics       clinics
group  acme/experiments   experiments
group  oldcorp            legacy
